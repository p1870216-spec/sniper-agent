- name: Деплой Sniper Agent в k3s
  hosts: sniper

  vars:
    repo_url: https://github.com/p1870216-spec/sniper-agent.git
    branch: main
    app_dir: /home/ubuntu/sniper
    local_env: /mnt/c/Users/Legion/Desktop/sniper/.env

  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

  tasks:
    - name: Скачать или обновить код (нужны манифесты k8s/)
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"

    - name: Передать .env с ключами на сервер
      ansible.builtin.copy:
        src: "{{ local_env }}"
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Создать namespace
      ansible.builtin.command:
        cmd: kubectl apply -f k8s/namespace.yaml
        chdir: "{{ app_dir }}"

    - name: Обновить Secret из .env
      ansible.builtin.shell:
        cmd: >
          kubectl create secret generic sniper-env
          --from-env-file=.env -n sniper
          --dry-run=client -o yaml | kubectl apply -f -
        chdir: "{{ app_dir }}"

    - name: Применить все манифесты
      ansible.builtin.command:
        cmd: kubectl apply -f k8s/
        chdir: "{{ app_dir }}"

    - name: Перезапустить бота, чтобы скачать свежий образ
      ansible.builtin.command:
        cmd: kubectl rollout restart deployment/sniper -n sniper

    - name: Дождаться, пока новая версия будет готова
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/sniper -n sniper --timeout=120s
