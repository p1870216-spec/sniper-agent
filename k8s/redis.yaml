# 1. Заявка на диск
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: sniper
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# 2. Сам Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sniper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
# 3. Постоянное имя "redis" внутри кластера
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sniper
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379